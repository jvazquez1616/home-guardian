<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Home Guardian</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #0f1115; color: #e6e6e6; }
        h1 { color: #4ade80; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #2a2d34; }
        th { color: #9ca3af; font-size: 14px; text-transform: uppercase; }
        .bloqueado { color: #f87171; font-weight: bold; }
        .activo { color: #4ade80; }
        button { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
        .btn-bloquear { background: #f87171; color: #1a1a1a; }
        .btn-desbloquear { background: #4ade80; color: #1a1a1a; }
    </style>
</head>
<body>
    <h1>🛡️ Home Guardian</h1>
    <p>Dispositivos conocidos en tu red:</p>

    <table>
        <tr>
            <th>IP</th>
            <th>MAC</th>
            <th>Última vez visto</th>
            <th>Estado</th>
            <th>Acción</th>
        </tr>
        {% for d in dispositivos %}
        <tr>
            <td>{{ d.ip }}</td>
            <td>{{ d.mac }}</td>
            <td>{{ d.ultima_vez_visto }}</td>
            {% if d.ip in bloqueadas %}
                <td class="bloqueado">🚫 Bloqueado</td>
                <td>
                    <form method="POST" action="/desbloquear" style="display:inline">
                        <input type="hidden" name="ip" value="{{ d.ip }}">
                        <button class="btn-desbloquear" type="submit">Desbloquear</button>
                    </form>
                </td>
            {% else %}
                <td class="activo">✅ Permitido</td>
                <td>
                    <form method="POST" action="/bloquear" style="display:inline">
                        <input type="hidden" name="ip" value="{{ d.ip }}">
                        <button class="btn-bloquear" type="submit">Bloquear</button>
                    </form>
                </td>
            {% endif %}
        </tr>
        {% endfor %}
    </table>
</body>
</html>
